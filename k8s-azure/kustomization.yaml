apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Azure (AKS) overlay. Kept as a sibling of k8s/ (not inside it) so Kustomize doesn't see a
# self-containment cycle. Reuses the whole base in ../k8s (namespace, workloads, services,
# ConfigMaps/Secrets, images -> Docker Hub) and only patches what differs on AKS: the Ingress
# class (traefik -> AKS app-routing NGINX) and its host (catch-all on the public IP).
# The base's local k3d flow (kubectl apply -k k8s/) is untouched.
resources:
  - ../k8s

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: expense-tracker

# CI/CD overrides the image TAG to the git SHA at deploy time via `kustomize edit set image`
# (appends an images: block here). Left empty so the base's :latest is the manual-deploy default.
