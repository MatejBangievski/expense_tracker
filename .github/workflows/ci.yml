name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/expense_tracker_backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ktlint + tests + build (Testcontainers uses the runner's Docker)
        run: ./gradlew ktlintCheck test bootJar --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  images:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # For arm64 (Apple Silicon k3d) also uncomment this QEMU step on the local branch.
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/expense_tracker_backend
          push: true
          # develop = amd64 only (what AKS runs). For local arm64 k3d, swap to the multi-arch line below.
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # develop = amd64 only (what AKS runs). For local arm64 k3d, swap to the multi-arch line below.
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- CD: roll out the freshly-pushed images to Azure AKS (only on push to develop) ----
  deploy:
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to AKS (rolling update to the git-SHA image)
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          # AKS admin kubeconfig (cert-based) supplied as a base64 secret — no service principal needed.
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$KUBECONFIG"
          # Pin the overlay to THIS commit's immutable image tag -> the tag change is what makes
          # Kubernetes perform a rolling update (a fixed :latest would not).
          cd k8s-azure
          # Target the image name AFTER the base's rename (base rewrites the short name to
          # <user>/expense-tracker-*), so the overlay's tag override actually matches and applies.
          kustomize edit set image \
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend=${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend=${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend:${{ github.sha }}
          kubectl apply -k .
          kubectl -n expense-tracker rollout status deploy/backend  --timeout=300s
          kubectl -n expense-tracker rollout status deploy/frontend --timeout=300s
