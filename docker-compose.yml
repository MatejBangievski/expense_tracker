services:
  db:
    image: postgres:18-alpine
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-expense_tracker_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (data goes in a versioned subdir).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/expense_tracker_backend
    image: expense-tracker-backend:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-expense_tracker_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-dev-fallback-secret-at-least-32-bytes-long-for-local-testing}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-fallback-encryption-secret-change-in-prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-no-key}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build: ./frontend
    image: expense-tracker-frontend:local
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
