<div class="shell">
  <aside class="sidebar">
    <a routerLink="/home" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 15 9 9 13 12 20 4" />
          <polyline points="15 4 20 4 20 9" />
        </svg>
      </span>
      <span class="brand-name">Expense Tracker</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Home</span>
      </a>
      <a routerLink="/categories" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span>Categories</span>
      </a>
      <a routerLink="/expenses" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3.5" y1="6" x2="3.51" y2="6" />
          <line x1="3.5" y1="12" x2="3.51" y2="12" />
          <line x1="3.5" y1="18" x2="3.51" y2="18" />
        </svg>
        <span>Expenses</span>
      </a>
      <a routerLink="/plans" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="2 7 9 4 15 7 22 4 22 17 15 20 9 17 2 20" />
          <line x1="9" y1="4" x2="9" y2="17" />
          <line x1="15" y1="7" x2="15" y2="20" />
        </svg>
        <span>Plans</span>
      </a>
      <a routerLink="/saving-plan" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1.5" />
        </svg>
        <span>Saving plan</span>
      </a>
      <a routerLink="/comparison" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="21" x2="21" y2="21" />
          <rect x="5" y="11" width="3.5" height="7" rx="0.5" />
          <rect x="10.25" y="7" width="3.5" height="11" rx="0.5" />
          <rect x="15.5" y="3" width="3.5" height="15" rx="0.5" />
        </svg>
        <span>Comparison</span>
      </a>
    </nav>

    <a routerLink="/profile" routerLinkActive="active" class="profile">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="profile-text">
        <span class="profile-name">{{ user()?.displayName }}</span>
        <span class="profile-link">View profile</span>
      </span>
    </a>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
