<div class="card shadow-sm h-100">
  <div class="card-body p-3 d-flex align-items-stretch gap-3">
    <span class="stat-icon bg-primary-subtle text-primary"><app-icon name="wallet" size="1.75rem" /></span>
    <div class="d-flex flex-column justify-content-center min-w-0">
      <span class="text-body-secondary small">Total Expenses</span>
      @if (loading()) {
        <span class="placeholder-glow"><span class="placeholder col-8"></span></span>
      } @else {
        <span class="h4 fw-bold mb-0 text-truncate">{{ total() | currency }}</span>
        @if (delta() !== null) {
          <span class="small" [class.text-success]="!deltaUp()" [class.text-danger]="deltaUp()">
            {{ deltaUp() ? '↑' : '↓' }} {{ deltaAbs() | number: '1.0-0' }}%
            <span class="text-body-secondary">vs last week</span>
          </span>
        } @else {
          <span class="small text-body-secondary">This week</span>
        }
      }
    </div>
  </div>
</div>
